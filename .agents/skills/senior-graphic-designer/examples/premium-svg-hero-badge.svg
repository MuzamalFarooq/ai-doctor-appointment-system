<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.75" />
    </linearGradient>

    <!-- Multi-Layer Soft Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.12" />
    </filter>

    <!-- Pulse Glow -->
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#14B8A6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Backing -->
  <rect width="240" height="240" rx="32" fill="#F1F5F9" />

  <!-- Glassmorphic Elevated Container -->
  <rect x="24" y="24" width="192" height="192" rx="28" fill="url(#glassFill)" stroke="#FFFFFF" stroke-width="2" filter="url(#badgeShadow)" />

  <!-- Gradient Core Ring -->
  <circle cx="120" cy="105" r="46" fill="url(#medGrad)" />

  <!-- Stylized Heartbeat ECG Waveform -->
  <path d="M96 105 H108 L114 90 L122 122 L128 98 L134 105 H144" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#heartGlow)" />

  <!-- Subtitle Pill Badge -->
  <g transform="translate(62, 168)">
    <rect width="116" height="24" rx="12" fill="#CCFBF1" />
    <circle cx="14" cy="12" r="3.5" fill="#0D9488" />
    <text x="24" y="16" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="0.5">AI VERIFIED</text>
  </g>
</svg>
